<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="wood" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#6b3f22"/>
      <stop offset="1" stop-color="#2e180b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#e3a92b"/>
      <stop offset="1" stop-color="#9c6a12"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a6e264"/>
      <stop offset="0.7" stop-color="#6fb43a"/>
      <stop offset="1" stop-color="#3f7a1f"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9493a"/>
      <stop offset="1" stop-color="#8e2219"/>
    </linearGradient>
    <radialGradient id="glass" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9f7ff"/>
      <stop offset="1" stop-color="#3fa7c9"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="244" r="228" fill="url(#wood)" stroke="url(#gold)" stroke-width="20"/>
  <circle cx="256" cy="244" r="210" fill="none" stroke="#2a1608" stroke-width="5" opacity="0.8"/>
  <g fill="#ffd45a" stroke="#7a4f0c" stroke-width="2">
    <circle cx="256" cy="16" r="6"/><circle cx="370" cy="47" r="6"/><circle cx="453" cy="130" r="6"/>
    <circle cx="484" cy="244" r="6"/><circle cx="142" cy="47" r="6"/><circle cx="59" cy="130" r="6"/>
    <circle cx="28" cy="244" r="6"/>
  </g>
  <!-- wood grain -->
  <g stroke="#24120a" stroke-width="3" fill="none" opacity="0.35">
    <path d="M70 180 Q256 150 442 185"/><path d="M60 250 Q256 225 452 255"/><path d="M90 320 Q256 300 430 330"/>
  </g>

  <!-- Ears -->
  <path d="M168 205 Q90 150 30 120 Q70 200 160 262 Z" fill="url(#skin)" stroke="#2f5c15" stroke-width="6" stroke-linejoin="round"/>
  <path d="M150 215 Q100 180 70 160 Q100 210 150 240 Z" fill="#4f8f2a" opacity="0.8"/>
  <path d="M344 205 Q422 150 482 120 Q442 200 352 262 Z" fill="url(#skin)" stroke="#2f5c15" stroke-width="6" stroke-linejoin="round"/>
  <path d="M362 215 Q412 180 442 160 Q412 210 362 240 Z" fill="#4f8f2a" opacity="0.8"/>
  <!-- earring -->
  <circle cx="455" cy="150" r="11" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- Head -->
  <path d="M256 112 C330 112 360 165 358 220 C356 285 318 330 256 332 C194 330 156 285 154 220 C152 165 182 112 256 112 Z"
        fill="url(#skin)" stroke="#2f5c15" stroke-width="6"/>

  <!-- Goggles on the forehead -->
  <path d="M168 156 Q256 128 344 156" fill="none" stroke="#5a3418" stroke-width="16" stroke-linecap="round"/>
  <circle cx="219" cy="150" r="28" fill="url(#glass)" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="293" cy="150" r="28" fill="url(#glass)" stroke="url(#gold)" stroke-width="9"/>
  <rect x="244" y="144" width="24" height="10" rx="4" fill="#b88a2a"/>
  <path d="M206 140 Q212 132 222 132" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M280 140 Q286 132 296 132" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Eyebrows (one cheekily raised) -->
  <path d="M190 192 Q212 176 238 190" stroke="#2f5c15" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M276 196 Q300 196 324 186" stroke="#2f5c15" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="216" cy="222" rx="24" ry="27" fill="#fff6a8" stroke="#2f5c15" stroke-width="4"/>
  <ellipse cx="298" cy="224" rx="24" ry="24" fill="#fff6a8" stroke="#2f5c15" stroke-width="4"/>
  <circle cx="226" cy="226" r="11" fill="#1b0f08"/>
  <circle cx="308" cy="228" r="11" fill="#1b0f08"/>
  <circle cx="230" cy="221" r="4" fill="#ffffff"/>
  <circle cx="312" cy="223" r="4" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M250 232 Q268 262 280 284 Q262 290 244 276 Z" fill="#5f9f31" stroke="#2f5c15" stroke-width="5" stroke-linejoin="round"/>

  <!-- Grin with a gold tooth -->
  <path d="M190 284 Q256 300 326 278 Q312 326 256 328 Q202 326 190 284 Z" fill="#3a1408" stroke="#2f5c15" stroke-width="5" stroke-linejoin="round"/>
  <path d="M204 290 L214 306 L224 293 Z" fill="#fffbe8"/>
  <path d="M293 291 L303 305 L312 287 Z" fill="#fffbe8"/>
  <rect x="246" y="294" width="20" height="16" rx="3" fill="url(#gold)" stroke="#7a4f0c" stroke-width="2"/>
  <path d="M232 318 Q256 326 280 317" stroke="#c4483a" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Die (left) -->
  <g transform="translate(92 318) rotate(-18)">
    <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#fffaf0" stroke="#3a2412" stroke-width="5"/>
    <circle cx="-15" cy="-15" r="7" fill="#b8322a"/><circle cx="0" cy="0" r="7" fill="#b8322a"/><circle cx="15" cy="15" r="7" fill="#b8322a"/>
  </g>
  <!-- Coin (right) -->
  <g transform="translate(420 318) rotate(12)">
    <circle r="36" fill="url(#gold)" stroke="#7a4f0c" stroke-width="5"/>
    <circle r="25" fill="none" stroke="#9c6a12" stroke-width="3"/>
    <text x="0" y="13" text-anchor="middle" font-family="Luckiest Guy" font-size="38" fill="#7a4f0c">G</text>
  </g>

  <!-- Ribbon -->
  <path d="M40 372 L92 372 L92 446 L40 446 L62 409 Z" fill="#7a1c14" stroke="#3a0d08" stroke-width="5" stroke-linejoin="round"/>
  <path d="M472 372 L420 372 L420 446 L472 446 L450 409 Z" fill="#7a1c14" stroke="#3a0d08" stroke-width="5" stroke-linejoin="round"/>
  <path d="M74 360 Q256 336 438 360 L438 434 Q256 410 74 434 Z" fill="url(#ribbon)" stroke="#3a0d08" stroke-width="6" stroke-linejoin="round"/>
  <text x="256" y="414" text-anchor="middle" font-family="Luckiest Guy" font-size="54"
        fill="#fff1c4" stroke="#3a0d08" stroke-width="8" paint-order="stroke" letter-spacing="2">GOBLIN GAMES</text>
</svg>
