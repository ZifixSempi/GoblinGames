<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GoblinGames logo: an original painted-style goblin in a black-and-gold
       coat (red mohawk, purple eyes, nose ring, silver hoops). -->
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#2f5552"/>
      <stop offset="0.6" stop-color="#173130"/>
      <stop offset="1" stop-color="#0a1414"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset="0.45" stop-color="#d4a23a"/>
      <stop offset="1" stop-color="#7d5612"/>
    </linearGradient>
    <radialGradient id="skin" cx="44%" cy="32%" r="72%">
      <stop offset="0" stop-color="#a9be4a"/>
      <stop offset="0.45" stop-color="#7e9a2c"/>
      <stop offset="0.85" stop-color="#55691b"/>
      <stop offset="1" stop-color="#3a4811"/>
    </radialGradient>
    <linearGradient id="earSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#97ad3c"/>
      <stop offset="1" stop-color="#4f6219"/>
    </linearGradient>
    <linearGradient id="earSkinR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97ad3c"/>
      <stop offset="1" stop-color="#4f6219"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a8222"/>
      <stop offset="0.45" stop-color="#9fb646"/>
      <stop offset="1" stop-color="#5a6f1c"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="mohawk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5e0a0a"/>
      <stop offset="0.6" stop-color="#b0171a"/>
      <stop offset="1" stop-color="#e2433a"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f0c6ff"/>
      <stop offset="0.45" stop-color="#b766e8"/>
      <stop offset="1" stop-color="#5a1f86"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9c0c8"/>
      <stop offset="1" stop-color="#5d646c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8232a"/>
      <stop offset="1" stop-color="#5e0c10"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="256" cy="244" r="212"/></clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="244" r="228" fill="url(#backdrop)" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="256" cy="244" r="212" fill="none" stroke="#3b2a0c" stroke-width="4"/>
  <circle cx="256" cy="244" r="236" fill="none" stroke="#3b2a0c" stroke-width="3"/>
  <!-- faint alchemy glow behind him, like the bottles in a goblin lab -->
  <circle cx="256" cy="210" r="150" fill="#3fa39a" opacity="0.10"/>

  <!-- Bust (coat), clipped to the badge -->
  <g clip-path="url(#badge)">
    <path d="M60 520 C70 420 120 372 196 352 L316 352 C392 372 442 420 452 520 Z" fill="url(#coat)" stroke="#000" stroke-width="3"/>
    <!-- vest and shirt -->
    <path d="M222 350 L256 430 L290 350 Z" fill="#3a3a40"/>
    <path d="M234 350 L256 392 L278 350 Z" fill="#e8e6dd"/>
    <path d="M256 360 L249 371 L256 382 L263 371 Z" fill="#2a2a30"/>
    <!-- high gold-trimmed collar -->
    <path d="M226 352 C204 336 186 314 178 292 L166 300 C172 338 196 368 220 384 Z" fill="#18181c" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286 352 C308 336 326 314 334 292 L346 300 C340 338 316 368 292 384 Z" fill="#18181c" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <!-- lapels with gold filigree -->
    <path d="M220 384 L196 470 L150 430 C170 410 196 394 220 384 Z" fill="#1d1d22" stroke="url(#gold)" stroke-width="3"/>
    <path d="M292 384 L316 470 L362 430 C342 410 316 394 292 384 Z" fill="#1d1d22" stroke="url(#gold)" stroke-width="3"/>
    <path d="M174 432 Q188 414 206 410 Q196 426 186 444" fill="none" stroke="#c9a646" stroke-width="2.5"/>
    <path d="M338 432 Q324 414 306 410 Q316 426 326 444" fill="none" stroke="#c9a646" stroke-width="2.5"/>
    <circle cx="242" cy="452" r="4" fill="url(#gold)"/><circle cx="270" cy="452" r="4" fill="url(#gold)"/>
    <!-- neck -->
    <path d="M232 318 L230 356 Q256 366 282 356 L280 318 Z" fill="#5c7220"/>
    <path d="M232 340 Q256 352 280 340" fill="none" stroke="#3a4811" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Ears -->
  <path d="M170 210 C136 192 90 158 24 112 C48 162 92 224 166 264 Z" fill="url(#earSkin)" stroke="#2c380c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M160 220 C128 202 94 178 60 150 C80 186 112 222 160 248 Z" fill="#4d6018" opacity="0.75"/>
  <path d="M100 160 C120 176 140 190 160 200" fill="none" stroke="#b5c95e" stroke-width="2" opacity="0.5"/>
  <path d="M342 210 C376 192 422 158 488 112 C464 162 420 224 346 264 Z" fill="url(#earSkinR)" stroke="#2c380c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M352 220 C384 202 418 178 452 150 C432 186 400 222 352 248 Z" fill="#4d6018" opacity="0.75"/>
  <!-- silver hoops in the lobes -->
  <circle cx="160" cy="270" r="11" fill="none" stroke="url(#silver)" stroke-width="4"/>
  <circle cx="174" cy="278" r="9" fill="none" stroke="url(#silver)" stroke-width="3.5"/>
  <circle cx="352" cy="270" r="11" fill="none" stroke="url(#silver)" stroke-width="4"/>

  <!-- Head -->
  <path d="M256 134 C314 134 354 160 356 206 C358 248 344 282 320 306 C300 324 280 336 256 336 C232 336 212 324 192 306 C168 282 154 248 156 206 C158 160 198 134 256 134 Z"
        fill="url(#skin)" stroke="#2c380c" stroke-width="4"/>
  <!-- cheek and jaw shading -->
  <path d="M172 252 C184 290 214 318 248 328 C222 328 196 310 178 284 Z" fill="#3a4811" opacity="0.35"/>
  <path d="M340 252 C328 290 298 318 264 328 C290 328 316 310 334 284 Z" fill="#3a4811" opacity="0.35"/>
  <!-- forehead wrinkles -->
  <path d="M214 172 Q256 160 298 172" fill="none" stroke="#3f4e12" stroke-width="2.5" opacity="0.6"/>
  <path d="M224 185 Q256 176 288 185" fill="none" stroke="#3f4e12" stroke-width="2" opacity="0.5"/>

  <!-- Mohawk: a thin red crest, spiky -->
  <path d="M246 140 L236 70 L251 108 L253 54 L261 104 L272 62 L267 112 L280 86 L268 142 Z" fill="url(#mohawk)" stroke="#3d0606" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M252 130 L254 80" stroke="#f0675c" stroke-width="2" opacity="0.7"/>

  <!-- Heavy brow ridge -->
  <path d="M184 210 C198 190 230 186 252 200 L260 200 C282 186 314 190 328 210 C310 203 284 205 262 215 L250 215 C228 205 202 203 184 210 Z" fill="#4c5f17" stroke="#2c380c" stroke-width="2.5"/>

  <!-- Eyes: narrow, heavy-lidded, glowing purple -->
  <path d="M198 224 Q222 208 248 224 Q222 238 198 224 Z" fill="#e9e6c8"/>
  <path d="M264 224 Q290 208 314 224 Q290 238 264 224 Z" fill="#e9e6c8"/>
  <circle cx="224" cy="224" r="9.5" fill="url(#iris)"/>
  <circle cx="288" cy="224" r="9.5" fill="url(#iris)"/>
  <circle cx="224" cy="224" r="3.5" fill="#160822"/>
  <circle cx="288" cy="224" r="3.5" fill="#160822"/>
  <circle cx="227" cy="220" r="2.2" fill="#ffffff"/>
  <circle cx="291" cy="220" r="2.2" fill="#ffffff"/>
  <!-- upper lids -->
  <path d="M196 225 Q222 204 250 224 Q222 214 196 225 Z" fill="#3f4e12"/>
  <path d="M262 224 Q290 204 316 225 Q290 214 262 224 Z" fill="#3f4e12"/>
  <!-- bags under the eyes -->
  <path d="M204 236 Q224 244 244 236" fill="none" stroke="#3f4e12" stroke-width="2" opacity="0.6"/>
  <path d="M268 236 Q288 244 308 236" fill="none" stroke="#3f4e12" stroke-width="2" opacity="0.6"/>

  <!-- Long hooked nose -->
  <path d="M248 214 C244 240 230 264 234 282 C238 302 278 302 282 282 C286 264 270 240 264 214 Z" fill="url(#nose)" stroke="#2c380c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M254 226 C252 248 248 266 250 280" fill="none" stroke="#c4d872" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="246" cy="291" rx="5" ry="3" fill="#26300a"/>
  <ellipse cx="270" cy="291" rx="5" ry="3" fill="#26300a"/>
  <!-- septum ring -->
  <circle cx="258" cy="302" r="9" fill="none" stroke="url(#silver)" stroke-width="3.5"/>

  <!-- Smile lines and mouth: a wide, knowing smirk -->
  <path d="M222 276 Q206 296 210 314" fill="none" stroke="#3f4e12" stroke-width="2.5" opacity="0.6"/>
  <path d="M290 276 Q306 296 302 314" fill="none" stroke="#3f4e12" stroke-width="2.5" opacity="0.6"/>
  <path d="M204 314 C232 308 284 308 310 312 C284 319 232 320 204 314 Z" fill="#1f2908" stroke="#1f2908" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M208 317 C234 338 282 338 306 315 C282 327 234 327 208 317 Z" fill="#738a29" stroke="#2c380c" stroke-width="2"/>
  <path d="M236 328 Q256 333 276 328" fill="none" stroke="#a9be4a" stroke-width="2" opacity="0.7"/>
  <path d="M308 312 Q314 308 315 302" fill="none" stroke="#2c380c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Die (left) -->
  <g transform="translate(80 330) rotate(-16)">
    <rect x="-28" y="-28" width="56" height="56" rx="9" fill="#f3ead8" stroke="#2a1a0c" stroke-width="4"/>
    <circle cx="-12" cy="-12" r="5.5" fill="#9e1f1f"/><circle cx="0" cy="0" r="5.5" fill="#9e1f1f"/><circle cx="12" cy="12" r="5.5" fill="#9e1f1f"/>
  </g>
  <!-- Coin (right) -->
  <g transform="translate(434 330) rotate(12)">
    <circle r="30" fill="url(#gold)" stroke="#6b470c" stroke-width="4"/>
    <circle r="21" fill="none" stroke="#9c6a12" stroke-width="2.5"/>
    <text x="0" y="11" text-anchor="middle" font-family="Luckiest Guy" font-size="32" fill="#6b470c">G</text>
  </g>

  <!-- Ribbon -->
  <path d="M40 410 L92 410 L92 482 L40 482 L62 446 Z" fill="#4a090c" stroke="#1e0405" stroke-width="5" stroke-linejoin="round"/>
  <path d="M472 410 L420 410 L420 482 L472 482 L450 446 Z" fill="#4a090c" stroke="#1e0405" stroke-width="5" stroke-linejoin="round"/>
  <path d="M74 398 Q256 374 438 398 L438 470 Q256 446 74 470 Z" fill="url(#ribbon)" stroke="#1e0405" stroke-width="6" stroke-linejoin="round"/>
  <path d="M86 410 Q256 388 426 410" fill="none" stroke="#d4a23a" stroke-width="2" opacity="0.8"/>
  <path d="M86 458 Q256 436 426 458" fill="none" stroke="#d4a23a" stroke-width="2" opacity="0.8"/>
  <text x="256" y="450" text-anchor="middle" font-family="Luckiest Guy" font-size="50"
        fill="#f6dd8a" stroke="#1e0405" stroke-width="8" paint-order="stroke" letter-spacing="2">GOBLIN GAMES</text>
  <!-- Die marker: everything between "Ears" and here is the goblin's face (used for the mascot). -->
</svg>
