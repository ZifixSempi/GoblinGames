# Builds and uploads a release whenever you push a version tag, e.g. v0.1.0
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The packager replaces @project-version@ in every .toc with the tag, zips the
# addon folders as described in .pkgmeta, and uploads the zip to:
#   - GitHub Releases (always)
#   - CurseForge, if the CF_API_KEY secret is set and the .toc files carry a
#     real ## X-Curse-Project-ID
#   - Wago, if the WAGO_API_TOKEN secret is set and the .toc has ## X-Wago-ID
#
# Secrets are added in GitHub: repo Settings > Secrets and variables > Actions.

name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code (with history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
